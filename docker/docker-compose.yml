services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medical_rag_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5444:5432"

    volumes:
      - medical_rag_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - medical_rag_network

volumes:
  medical_rag_postgres_data:
    name: medical_rag_postgres_data

networks:
  medical_rag_network:
    name: medical_rag_network
    driver: bridge
